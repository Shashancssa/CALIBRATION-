<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 500px;">
        <div class="card p-4 shadow-sm border-0" style="border-radius: 15px;">
            <h4 class="text-danger">Update Record</h4>
            <p class="text-muted">Asset: {{ item.asset_id }} | {{ item.entry_type }}</p>
            <hr>
            <form method="POST" enctype="multipart/form-data">
                <label class="small fw-bold">Update Agency / Supplier</label>
                <input type="text" name="validated_by" class="form-control mb-3" value="{{ item.validated_by }}" required>
                
                <label class="small fw-bold">New Performed Date</label>
                <input type="date" name="done_on" class="form-control mb-3" required>
                
                <label class="small fw-bold">New Due Date</label>
                <input type="date" name="due_date" class="form-control mb-3" required>
                
                <label class="small fw-bold">New NABL Certificate</label>
                <input type="file" name="nabl_cert" class="form-control mb-4">
                
                <button type="submit" class="btn btn-danger w-100 fw-bold">UPDATE MASTER RECORD</button>
                <a href="/" class="btn btn-link w-100 mt-2 text-decoration-none">Cancel</a>
            </form>
        </div>
    </div>
    <footer class="position-fixed bottom-0 start-0 w-100 text-center py-2 bg-white border-top small">
        Developed by :- Shashank C Mail:- Shashank.c@kaynestechnology.net
    </footer>
</body>
</html>
