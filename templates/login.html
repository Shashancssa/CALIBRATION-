<!DOCTYPE html>
<html>
<head>
    <title>Kaynes Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="card m-auto p-4 shadow-sm" style="width: 320px;">
        <h5 class="text-center mb-4">Kaynes Calibration</h5>
        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        <form action="/login" method="POST">
            <input type="text" name="username" class="form-control mb-2" placeholder="Username" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
            <button class="btn btn-primary w-100">Login</button>
        </form>
        <div class="text-center mt-3 text-muted" style="font-size: 10px;">
            Admin: admin / admin123<br>
            User: user / user123
        </div>
    </div>
    <footer class="position-fixed bottom-0 start-0 w-100 text-center py-2 bg-white border-top small">
        Developed by :- Shashank C Mail:- Shashank.c@kaynestechnology.net
    </footer>
</body>
</html>
